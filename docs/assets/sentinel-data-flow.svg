<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0b1627"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000814" flood-opacity="0.7"/>
    </filter>
    <marker id="arrow-cyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#28d7f5"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#42e6a4"/>
    </marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#ffc857"/>
    </marker>
    <style>
      .title { font: 700 42px "Segoe UI", Arial, sans-serif; fill: #f4f8ff; letter-spacing: 1px; }
      .subtitle { font: 400 20px "Segoe UI", Arial, sans-serif; fill: #8ea5bf; }
      .lane { font: 700 17px "Segoe UI", Arial, sans-serif; fill: #28d7f5; letter-spacing: 2px; }
      .node-title { font: 700 20px "Segoe UI", Arial, sans-serif; fill: #f4f8ff; }
      .node-text { font: 400 15px "Segoe UI", Arial, sans-serif; fill: #aebfd2; }
      .tiny { font: 600 13px "Segoe UI", Arial, sans-serif; fill: #7f98b4; }
      .flow-label { font: 600 14px "Segoe UI", Arial, sans-serif; fill: #b9eefa; }
      .panel { fill: #101f32; stroke: #27445f; stroke-width: 2; filter: url(#shadow); }
      .source { fill: #10243a; stroke: #28d7f5; stroke-width: 2; filter: url(#shadow); }
      .process { fill: #102a2b; stroke: #42e6a4; stroke-width: 2; filter: url(#shadow); }
      .event { fill: #302817; stroke: #ffc857; stroke-width: 2; filter: url(#shadow); }
      .alert { fill: #351c25; stroke: #ff647c; stroke-width: 2; filter: url(#shadow); }
      .optional { fill: #211d38; stroke: #a98bff; stroke-width: 2; stroke-dasharray: 8 7; filter: url(#shadow); }
      .cyan-line { fill: none; stroke: #28d7f5; stroke-width: 4; marker-end: url(#arrow-cyan); }
      .green-line { fill: none; stroke: #42e6a4; stroke-width: 4; marker-end: url(#arrow-green); }
      .amber-line { fill: none; stroke: #ffc857; stroke-width: 4; marker-end: url(#arrow-amber); }
      .dash-line { fill: none; stroke: #a98bff; stroke-width: 3; stroke-dasharray: 9 8; marker-end: url(#arrow-cyan); opacity: 0.85; }
      .grid { stroke: #16304a; stroke-width: 1; opacity: 0.35; }
    </style>
  </defs>

  <rect width="1920" height="1200" fill="url(#bg)"/>
  <g>
    <path class="grid" d="M0 120H1920 M0 240H1920 M0 360H1920 M0 480H1920 M0 600H1920 M0 720H1920 M0 840H1920 M0 960H1920 M0 1080H1920"/>
    <path class="grid" d="M120 0V1200 M240 0V1200 M360 0V1200 M480 0V1200 M600 0V1200 M720 0V1200 M840 0V1200 M960 0V1200 M1080 0V1200 M1200 0V1200 M1320 0V1200 M1440 0V1200 M1560 0V1200 M1680 0V1200 M1800 0V1200"/>
  </g>

  <text x="80" y="70" class="title">SENTINEL // END-TO-END DATA FLOW</text>
  <text x="82" y="104" class="subtitle">Midnight Operations Dashboard · Current C++ runtime and optional reasoning service</text>
  <rect x="1515" y="48" width="325" height="48" rx="24" fill="#0f2134" stroke="#28d7f5"/>
  <circle cx="1550" cy="72" r="7" fill="#42e6a4"/>
  <text x="1570" y="79" class="tiny" fill="#d8e8f6">PERSON DETECTION MONITORING ACTIVE</text>

  <text x="80" y="160" class="lane">01 · INGEST</text>
  <text x="465" y="160" class="lane">02 · VISION PIPELINE</text>
  <text x="1190" y="160" class="lane">03 · CONTEXT + RESPONSE</text>

  <rect x="70" y="190" width="300" height="115" rx="16" class="source"/>
  <text x="95" y="225" class="node-title">Video Input</text>
  <text x="95" y="255" class="node-text">Webcam · Video file · RTSP stream</text>
  <text x="95" y="280" class="tiny">argv[1] or default source</text>

  <rect x="70" y="365" width="300" height="130" rx="16" class="source"/>
  <text x="95" y="400" class="node-title">VideoSource</text>
  <text x="95" y="430" class="node-text">OpenCV VideoCapture</text>
  <text x="95" y="455" class="node-text">RTSP: latest-frame background thread</text>
  <text x="95" y="480" class="tiny">Avoids stale buffered frames</text>

  <path d="M220 305V365" class="cyan-line"/>
  <text x="236" y="340" class="flow-label">frames</text>

  <rect x="455" y="190" width="300" height="115" rx="16" class="panel"/>
  <text x="480" y="225" class="node-title">Main Frame Loop</text>
  <text x="480" y="255" class="node-text">Read latest frame and initialize zones</text>
  <text x="480" y="280" class="tiny">Runs until Q / Esc</text>

  <path d="M370 430H420V247H455" class="cyan-line"/>

  <rect x="455" y="365" width="300" height="130" rx="16" class="alert"/>
  <text x="480" y="400" class="node-title">Frame Ring Buffer</text>
  <text x="480" y="430" class="node-text">Clone and retain latest 60 frames</text>
  <text x="480" y="455" class="node-text">Source for event video clips</text>
  <text x="480" y="480" class="tiny">Receives every frame</text>

  <path d="M605 305V365" class="cyan-line"/>

  <rect x="825" y="190" width="310" height="115" rx="16" class="process"/>
  <text x="850" y="225" class="node-title">Inference Gate</text>
  <text x="850" y="255" class="node-text">Process every third frame</text>
  <text x="850" y="280" class="tiny">Pi-oriented performance control</text>

  <path d="M755 247H825" class="green-line"/>

  <rect x="825" y="365" width="310" height="130" rx="16" class="process"/>
  <text x="850" y="400" class="node-title">YOLO Preprocess</text>
  <text x="850" y="430" class="node-text">Letterbox to 320 × 320</text>
  <text x="850" y="455" class="node-text">BGR → RGB · Normalize · CHW tensor</text>
  <text x="850" y="480" class="tiny">models/yolo/model_320.onnx</text>

  <path d="M980 305V365" class="green-line"/>

  <rect x="825" y="555" width="310" height="130" rx="16" class="process"/>
  <text x="850" y="590" class="node-title">ONNX Runtime Inference</text>
  <text x="850" y="620" class="node-text">YOLOv8 CPU session</text>
  <text x="850" y="645" class="node-text">Produces candidate boxes + class scores</text>
  <text x="850" y="670" class="tiny">Extended graph optimization · 2 threads</text>

  <path d="M980 495V555" class="green-line"/>

  <rect x="825" y="745" width="310" height="130" rx="16" class="process"/>
  <text x="850" y="780" class="node-title">Decode + NMS</text>
  <text x="850" y="810" class="node-text">Confidence ≥ 0.25 · NMS 0.45</text>
  <text x="850" y="835" class="node-text">Keep COCO class 0: person only</text>
  <text x="850" y="860" class="tiny">Boxes mapped back to source frame</text>

  <path d="M980 685V745" class="green-line"/>

  <rect x="1190" y="190" width="300" height="115" rx="16" class="process"/>
  <text x="1215" y="225" class="node-title">IoU Tracker</text>
  <text x="1215" y="255" class="node-text">Matches boxes and assigns track IDs</text>
  <text x="1215" y="280" class="tiny">Tracks survive up to 45 missing frames</text>

  <path d="M1135 810H1160V247H1190" class="green-line"/>

  <rect x="1190" y="365" width="300" height="130" rx="16" class="event"/>
  <text x="1215" y="400" class="node-title">Event Engine</text>
  <text x="1215" y="430" class="node-text">Dwell time · entered scene · exited</text>
  <text x="1215" y="455" class="node-text">Updates tracked detections</text>
  <text x="1215" y="480" class="tiny">Recent event history</text>

  <rect x="1540" y="365" width="300" height="130" rx="16" class="event"/>
  <text x="1565" y="400" class="node-title">Zone Manager</text>
  <text x="1565" y="430" class="node-text">CENTER_ZONE · LEFT_ZONE</text>
  <text x="1565" y="455" class="node-text">Entry · exit · loitering after 10s</text>
  <text x="1565" y="480" class="tiny">Uses person box center point</text>

  <path d="M1340 305V365" class="amber-line"/>
  <path d="M1490 247H1690V365" class="amber-line"/>

  <rect x="1190" y="555" width="300" height="130" rx="16" class="panel"/>
  <text x="1215" y="590" class="node-title">Scene State Builder</text>
  <text x="1215" y="620" class="node-text">Persons · boxes · dwell · zones</text>
  <text x="1215" y="645" class="node-text">Loitering flags · recent events</text>
  <text x="1215" y="670" class="tiny">Prints structured JSON every 5s</text>

  <path d="M1340 495V555" class="amber-line"/>
  <path d="M1690 495V520H1490V620" class="amber-line"/>

  <rect x="1540" y="555" width="300" height="130" rx="16" class="alert"/>
  <text x="1565" y="590" class="node-title">Event Clip Recorder</text>
  <text x="1565" y="620" class="node-text">Loitering triggers ring-buffer save</text>
  <text x="1565" y="645" class="node-text">MJPG AVI at 10 FPS</text>
  <text x="1565" y="670" class="tiny">data/clips/event_*.avi · 10s cooldown</text>

  <path d="M1690 495V555" class="amber-line"/>

  <rect x="1190" y="745" width="300" height="130" rx="16" class="panel"/>
  <text x="1215" y="780" class="node-title">Local Risk Summary</text>
  <text x="1215" y="810" class="node-text">No person · monitoring · loitering</text>
  <text x="1215" y="835" class="node-text">Assigns low or medium risk</text>
  <text x="1215" y="860" class="tiny">Current active reasoning path</text>

  <path d="M1340 685V745" class="cyan-line"/>

  <rect x="1540" y="745" width="300" height="130" rx="16" class="optional"/>
  <text x="1565" y="780" class="node-title">Optional LLM Service</text>
  <text x="1565" y="810" class="node-text">FastAPI /reason → OpenAI response</text>
  <text x="1565" y="835" class="node-text">Summary · risk · action</text>
  <text x="1565" y="860" class="tiny">Present in repo, not wired into runtime</text>

  <path d="M1490 620H1515V810H1540" class="dash-line"/>

  <rect x="455" y="955" width="1385" height="145" rx="18" class="panel"/>
  <text x="490" y="995" class="node-title">Overlay + Display</text>
  <text x="490" y="1028" class="node-text">Draw zones, tracked person boxes, IDs, dwell time, FPS, frame time, latest event, summary, and risk.</text>
  <text x="490" y="1062" class="node-text">OpenCV imshow presents every frame; inference results remain visible between processed frames.</text>

  <path d="M605 495V925H750V955" class="cyan-line"/>
  <path d="M1340 875V925H1220V955" class="cyan-line"/>
  <path d="M1690 875V925H1600V955" class="dash-line"/>

  <rect x="70" y="955" width="300" height="145" rx="18" class="source"/>
  <text x="95" y="995" class="node-title">Operator Output</text>
  <text x="95" y="1028" class="node-text">Live Sentinel monitoring window</text>
  <text x="95" y="1062" class="node-text">Console events + SceneState JSON</text>

  <path d="M455 1027H370" class="cyan-line"/>

  <g transform="translate(75 1142)">
    <circle cx="8" cy="0" r="7" fill="#28d7f5"/><text x="24" y="6" class="tiny">frame / display flow</text>
    <circle cx="220" cy="0" r="7" fill="#42e6a4"/><text x="236" y="6" class="tiny">vision processing</text>
    <circle cx="430" cy="0" r="7" fill="#ffc857"/><text x="446" y="6" class="tiny">events / zones</text>
    <circle cx="625" cy="0" r="7" fill="#ff647c"/><text x="641" y="6" class="tiny">recording response</text>
    <line x1="850" y1="0" x2="910" y2="0" stroke="#a98bff" stroke-width="3" stroke-dasharray="9 8"/>
    <text x="925" y="6" class="tiny">optional / currently disconnected</text>
  </g>
</svg>
